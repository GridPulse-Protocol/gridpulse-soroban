[workspace]
resolver = "2"
members = ["contracts/gridpulse"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT"
repository = "https://github.com/gridpulse-soroban/gridpulse-soroban"

[workspace.dependencies]
soroban-sdk = "27.0.5"

# Optimized profile for compiling to `wasm32v1-none`. Contracts are built with
# `stellar contract build`, not `cargo build` (see the README).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release.build-override]
opt-level = 3

[profile.dev]
overflow-checks = true
