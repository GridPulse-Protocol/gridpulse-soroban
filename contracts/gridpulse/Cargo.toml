[package]
name = "gridpulse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GridPulse: DePIN solar microgrid peer-to-peer wheeling on Soroban"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Used only in tests to produce real Ed25519 signatures for the IoT meter.
ed25519-dalek = "2"
